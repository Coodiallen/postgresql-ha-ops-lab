---
- name: Install PostgreSQL repository prerequisites
  ansible.builtin.apt:
    name:
      - postgresql-common
      - ca-certificates
      - curl
      - python3-venv
    state: present
    update_cache: true

- name: Disable automatic PostgreSQL cluster creation
  ansible.builtin.lineinfile:
    path: /etc/postgresql-common/createcluster.conf
    regexp: '^#?create_main_cluster'
    line: 'create_main_cluster = false'
    create: true
    mode: "0644"

- name: Create PGDG key directory
  ansible.builtin.file:
    path: /usr/share/postgresql-common/pgdg
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install PGDG repository key
  ansible.builtin.get_url:
    url: "https://www.postgresql.org/media/keys/ACCC4CF8.asc"
    dest: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure PGDG repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pgdg.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://apt.postgresql.org/pub/repos/apt
      Suites: {{ ansible_facts["distribution_release"] }}-pgdg
      Architectures: amd64
      Components: main
      Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc

- name: Install PostgreSQL 18
  ansible.builtin.apt:
    name:
      - postgresql-{{ postgresql_version }}
      - postgresql-client-{{ postgresql_version }}
    state: present
    update_cache: true

- name: Stop and disable native PostgreSQL service
  ansible.builtin.systemd_service:
    name: postgresql
    state: stopped
    enabled: false

- name: Create Patroni virtual environment
  ansible.builtin.command:
    cmd: python3 -m venv /opt/patroni
    creates: /opt/patroni/bin/python

- name: Install Patroni
  ansible.builtin.pip:
    name: "patroni[psycopg3,etcd3]=={{ patroni_version }}"
    executable: /opt/patroni/bin/pip

- name: Create Patroni configuration directory
  ansible.builtin.file:
    path: /etc/patroni
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Create PostgreSQL Patroni data directory
  ansible.builtin.file:
    path: "/var/lib/postgresql/{{ postgresql_version }}/patroni"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Install Patroni configuration
  ansible.builtin.template:
    src: patroni.yml.j2
    dest: /etc/patroni/patroni.yml
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Restart patroni

- name: Install Patroni systemd service
  ansible.builtin.template:
    src: patroni.service.j2
    dest: /etc/systemd/system/patroni.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart patroni

- name: Ensure Patroni is enabled and running
  ansible.builtin.systemd_service:
    name: patroni
    state: started
    enabled: true
    daemon_reload: true
