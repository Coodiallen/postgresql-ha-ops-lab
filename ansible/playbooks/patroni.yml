---
- name: Configure PostgreSQL Patroni cluster
  hosts: postgres
  become: true
  gather_facts: true

  vars_files:
    - ../inventory/secrets/postgres.yml

  roles:
    - patroni

- name: Initialize Patroni database roles
  hosts: postgres
  become: true
  gather_facts: false

  vars_files:
    - ../inventory/secrets/postgres.yml

  tasks:
    - name: Detect current PostgreSQL primary
      become_user: postgres
      ansible.builtin.command:
        cmd: >-
          /usr/lib/postgresql/{{ postgresql_version }}/bin/psql
          -Atqc
          "SELECT CASE WHEN pg_is_in_recovery() THEN 'f' ELSE 't' END;"
      register: patroni_primary_check
      changed_when: false
      failed_when: false

    - name: Ensure Patroni database roles exist on primary
      become_user: postgres
      ansible.builtin.shell: |
        /usr/lib/postgresql/{{ postgresql_version }}/bin/psql \
          -v ON_ERROR_STOP=1 <<'SQL'

        ALTER ROLE postgres
          WITH SUPERUSER LOGIN
          PASSWORD '{{ patroni_superuser_password }}';

        DO $do$
        BEGIN
          IF EXISTS (
            SELECT 1 FROM pg_roles
            WHERE rolname = '{{ patroni_replication_username }}'
          ) THEN
            ALTER ROLE {{ patroni_replication_username }}
              WITH LOGIN REPLICATION
              PASSWORD '{{ patroni_replication_password }}';
          ELSE
            CREATE ROLE {{ patroni_replication_username }}
              WITH LOGIN REPLICATION
              PASSWORD '{{ patroni_replication_password }}';
          END IF;
        END
        $do$;

        DO $do$
        BEGIN
          IF EXISTS (
            SELECT 1 FROM pg_roles
            WHERE rolname = '{{ patroni_rewind_username }}'
          ) THEN
            ALTER ROLE {{ patroni_rewind_username }}
              WITH LOGIN
              PASSWORD '{{ patroni_rewind_password }}';
          ELSE
            CREATE ROLE {{ patroni_rewind_username }}
              WITH LOGIN
              PASSWORD '{{ patroni_rewind_password }}';
          END IF;
        END
        $do$;

        GRANT EXECUTE ON FUNCTION
          pg_catalog.pg_ls_dir(text, boolean, boolean)
          TO {{ patroni_rewind_username }};

        GRANT EXECUTE ON FUNCTION
          pg_catalog.pg_stat_file(text, boolean)
          TO {{ patroni_rewind_username }};

        GRANT EXECUTE ON FUNCTION
          pg_catalog.pg_read_binary_file(text)
          TO {{ patroni_rewind_username }};

        GRANT EXECUTE ON FUNCTION
          pg_catalog.pg_read_binary_file(text, bigint, bigint, boolean)
          TO {{ patroni_rewind_username }};
        SQL
      when:
        - patroni_primary_check.rc == 0
        - patroni_primary_check.stdout == "t"
      no_log: true
      changed_when: false
